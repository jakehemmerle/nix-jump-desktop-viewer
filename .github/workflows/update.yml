name: update

# Poll the upstream Homebrew cask for a new release, verify it builds (and is
# authentic), then commit the bump straight to main.
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-14 # Apple Silicon; matches the universal macOS artifact
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Sync source.json with upstream
        id: sync
        run: |
          ./scripts/update-from-cask.sh | tee /tmp/update.log
          if tail -1 /tmp/update.log | grep -qx changed; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify authenticity
        if: steps.sync.outputs.changed == 'true'
        run: |
          nix build --print-build-logs .#jump-desktop
          ./scripts/verify-signature.sh result

      - name: Commit bump to main
        if: steps.sync.outputs.changed == 'true'
        run: |
          version="$(jq -r .version pkgs/jump-desktop/source.json)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/jump-desktop/source.json
          git commit -m "chore: bump jump-desktop to ${version}"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main…"
            git pull --rebase --autostash origin main
          done
          echo "ERROR: could not push bump after 3 attempts" >&2
          exit 1
